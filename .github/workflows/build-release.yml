name: Compilar y publicar el .exe

# Se ejecuta automáticamente cuando subes un tag de versión (ej. 2.1.1 o
# v2.1.1, ambos valen), y también se puede lanzar a mano desde la pestaña
# "Actions" de GitHub (botón "Run workflow"), sin necesitar un tag.
on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write  # Necesario para poder publicar el Release.

jobs:
  build:
    # Máquina de Windows real proporcionada por GitHub: aquí sí se genera
    # un .exe de Windows de verdad, a diferencia de compilar en Linux.
    runs-on: windows-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar el .exe
        run: pyinstaller main.spec

      - name: Leer la versión desde VERSION
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publicar como Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: dist/main.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
